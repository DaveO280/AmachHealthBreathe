name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.3.app/Contents/Developer

jobs:
  # ── Shared package tests (macOS, fast) ─────────────────────────
  test-shared:
    name: Shared Package Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/.spm-cache
          key: spm-${{ hashFiles('Shared/Package.resolved') }}
          restore-keys: spm-

      - name: swift test (Shared package)
        working-directory: Shared
        run: swift test --parallel

  # ── iOS build ───────────────────────────────────────────────────
  build-ios:
    name: Build iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Regenerate project
        run: xcodegen generate

      - name: Build iOS
        run: |
          xcodebuild build \
            -project AmachBreathe.xcodeproj \
            -scheme AmachBreathe \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || cat

  # ── watchOS build ───────────────────────────────────────────────
  build-watchos:
    name: Build watchOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Regenerate project
        run: xcodegen generate

      - name: Build watchOS
        run: |
          xcodebuild build \
            -project AmachBreathe.xcodeproj \
            -scheme AmachBreatheWatch \
            -destination "generic/platform=watchOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || cat

  # ── SwiftLint ───────────────────────────────────────────────────
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
