included:
  - iOS/Sources
  - watchOS/Sources
  - Shared/Sources

excluded:
  - .build
  - DerivedData

disabled_rules:
  - trailing_whitespace
  - identifier_name
  - type_name
  - inclusive_language
  - nesting
  - large_tuple
  - redundant_string_enum_value
  - optional_data_string_conversion

opt_in_rules:
  - empty_count
  - explicit_init

line_length:
  warning: 300
  error: 400

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 1000
  error: 1200

function_body_length:
  warning: 120
  error: 150

function_parameter_count:
  warning: 8
  error: 10

cyclomatic_complexity:
  warning: 15
  error: 20
