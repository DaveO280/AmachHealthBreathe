name: AmachBreathe
options:
  bundleIdPrefix: com.amach
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  AmachBreatheShared:
    path: Shared

targets:

  # ── iOS App ──────────────────────────────────────────────────
  AmachBreathe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.amach.breathe
    sources:
      - path: iOS/Sources
        type: group
      - path: iOS/PrivacyInfo.xcprivacy
        type: file
    dependencies:
      - package: AmachBreatheShared
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: StoreKit.framework
      - target: AmachBreatheWatch
        embed: true
    entitlements:
      path: iOS/AmachBreathe.entitlements
      properties:
        com.apple.developer.healthkit: YES
        com.apple.developer.healthkit.access: []
    settings:
      PRODUCT_NAME: "Amach Breathe"
      PRODUCT_MODULE_NAME: AmachBreathe
      SWIFT_VERSION: "6.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      INFOPLIST_FILE: iOS/Sources/App/Info.plist
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      CODE_SIGNING_REQUIRED: "YES"

  # ── iOS Unit Tests ────────────────────────────────────────────
  AmachBreatheTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.amach.breathe.tests
    sources:
      - path: iOS/Tests/Unit
    dependencies:
      - target: AmachBreathe
      - package: AmachBreatheShared
    settings:
      SWIFT_VERSION: "6.0"
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Amach Breathe.app/Amach Breathe"
      BUNDLE_LOADER: "$(TEST_HOST)"
      GENERATE_INFOPLIST_FILE: "YES"

  # ── watchOS App ───────────────────────────────────────────────
  AmachBreatheWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    bundleId: com.amach.breathe.watchkitapp
    sources:
      - path: watchOS/Sources
        type: group
    dependencies:
      - package: AmachBreatheShared
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: WidgetKit.framework
      - target: AmachBreatheWatchComplication
        embed: true
    entitlements:
      path: watchOS/AmachBreatheWatch.entitlements
      properties:
        com.apple.developer.healthkit: YES
        com.apple.developer.healthkit.access: []
    settings:
      PRODUCT_NAME: "Amach Breathe Watch"
      PRODUCT_BUNDLE_IDENTIFIER: com.amach.breathe.watchkitapp
      SWIFT_VERSION: "6.0"
      TARGETED_DEVICE_FAMILY: "4"
      INFOPLIST_FILE: watchOS/Sources/App/Info.plist
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      CODE_SIGNING_REQUIRED: "YES"
      WKApplication: "YES"

  # ── watchOS Complication Extension ────────────────────────────
  AmachBreatheWatchComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    bundleId: com.amach.breathe.watchkitapp.complication
    sources:
      - path: watchOS/Complication
        type: group
    dependencies:
      - package: AmachBreatheShared
      - sdk: WidgetKit.framework
    settings:
      PRODUCT_NAME: AmachBreatheWatchComplication
      PRODUCT_BUNDLE_IDENTIFIER: com.amach.breathe.watchkitapp.complication
      SWIFT_VERSION: "6.0"
      TARGETED_DEVICE_FAMILY: "4"
      INFOPLIST_FILE: watchOS/Complication/Info.plist
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      CODE_SIGNING_REQUIRED: "YES"
      SKIP_INSTALL: "YES"

schemes:
  AmachBreathe:
    build:
      targets:
        AmachBreathe: all
        AmachBreatheTests: [test]
    test:
      targets:
        - AmachBreatheTests
      commandLineArguments: {}
    run:
      config: Debug
    archive:
      config: Release
