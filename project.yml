name: AmachBreathe
options:
  bundleIdPrefix: com.amach
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  AmachBreatheShared:
    path: Shared

targets:

  # ── iOS App ──────────────────────────────────────────────────
  AmachBreathe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.amach.AmachBreathe
    sources:
      - path: iOS/Sources
        type: group
      - path: iOS/Assets.xcassets
      - path: iOS/PrivacyInfo.xcprivacy
        type: file
    dependencies:
      - package: AmachBreatheShared
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: StoreKit.framework
      - target: AmachBreatheWatch
        embed: true
    entitlements:
      path: iOS/AmachBreathe.entitlements
      properties:
        com.apple.developer.healthkit: YES
        com.apple.developer.healthkit.access: []
    settings:
      PRODUCT_NAME: "Amach Breathe"
      PRODUCT_MODULE_NAME: AmachBreathe
      SWIFT_VERSION: "6.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      INFOPLIST_FILE: iOS/Sources/App/Info.plist
      CODE_SIGN_STYLE: Automatic
      CODE_SIGNING_REQUIRED: "YES"
      DEVELOPMENT_TEAM: 6VDX3QKK79
      # Build-number script writes the in-tree Info.plist, which is outside
      # the sandbox's permitted regions, so disable here.
      ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    preBuildScripts:
      - name: Increment Build Number
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            CURRENT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFOPLIST_FILE")
            NEW=$((CURRENT + 1))
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW" "$INFOPLIST_FILE"
          fi

  # ── iOS Unit Tests ────────────────────────────────────────────
  AmachBreatheTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.amach.AmachBreathe.tests
    sources:
      - path: iOS/Tests/Unit
    dependencies:
      - target: AmachBreathe
      - package: AmachBreatheShared
    settings:
      SWIFT_VERSION: "6.0"
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Amach Breathe.app/Amach Breathe"
      BUNDLE_LOADER: "$(TEST_HOST)"
      GENERATE_INFOPLIST_FILE: "YES"

  # ── watchOS App ───────────────────────────────────────────────
  AmachBreatheWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    bundleId: com.amach.AmachBreathe.watchkitapp
    sources:
      - path: watchOS/Sources
        type: group
      - path: watchOS/Assets.xcassets
    dependencies:
      - package: AmachBreatheShared
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: WidgetKit.framework
    entitlements:
      path: watchOS/AmachBreatheWatch.entitlements
      properties:
        com.apple.developer.healthkit: YES
    settings:
      PRODUCT_NAME: "Amach Breathe Watch"
      PRODUCT_BUNDLE_IDENTIFIER: com.amach.AmachBreathe.watchkitapp
      SWIFT_VERSION: "6.0"
      TARGETED_DEVICE_FAMILY: "4"
      INFOPLIST_FILE: watchOS/Sources/App/Info.plist
      CODE_SIGN_STYLE: Automatic
      CODE_SIGNING_REQUIRED: "YES"
      DEVELOPMENT_TEAM: 6VDX3QKK79
      WKApplication: "YES"
      # Build-number script writes the in-tree Info.plist, which is outside
      # the sandbox's permitted regions, so disable here.
      ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    preBuildScripts:
      - name: Increment Build Number
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            CURRENT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFOPLIST_FILE")
            NEW=$((CURRENT + 1))
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW" "$INFOPLIST_FILE"
          fi

schemes:
  AmachBreathe:
    build:
      targets:
        AmachBreathe: all
        AmachBreatheTests: [test]
    test:
      targets:
        - AmachBreatheTests
      commandLineArguments: {}
    run:
      config: Debug
    archive:
      config: Release
